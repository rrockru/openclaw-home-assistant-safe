name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: openclaw plugins build --root . --entry ./dist/index.js --check
      - run: openclaw plugins validate --root . --entry ./dist/index.js
      - run: npm test
      - run: npm pack --dry-run
